required:
  - raw_threshold
  - original
  - moving_average
  - moving_median
  - hampel
  - kalman
  - ewma
  - cusum
  - pca
  - glr
  - recursive_pca
  - isolation_forest
  - one_class_svm
  - local_outlier_factor
optional: []
full_replay: []
defaults:
  window: 5
  ml_calibration_fraction: 0.2
  ml_contamination: 0.05
  ml_neighbors: 20
  supervisor_confirm_samples: 3
  supervisor_cooldown_samples: 4
  threshold_multiplier: 3.0
  alpha: 0.2
  cusum_drift: 0.5
  cusum_threshold: 5.0
  glr_window: 12
  glr_threshold: 3.0
  recursive_pca_window: 24
  recursive_pca_threshold: 4.0
  kalman_process_var: 0.01
  kalman_measurement_var: 1.0
tuning:
  split: validation
  objective_weights:
    balanced_accuracy: 1.0
    false_actuations: -0.01
    false_alarm_events: -0.0005
    mean_detection_delay_samples: -0.001
  grids:
    threshold_multiplier: [3.0, 5.0]
    window: [5, 15]
    alpha: [0.1, 0.4]
    cusum_drift: [0.25, 0.75]
    cusum_threshold: [3.0, 8.0]
    kalman_process_var: [0.001, 0.05]
    kalman_measurement_var: [0.25, 4.0]
    glr_window: [8, 24]
    glr_threshold: [2.0, 4.0]
    recursive_pca_window: [12, 36]
    recursive_pca_threshold: [3.0, 5.0]
    ml_contamination: [0.02, 0.10]
    ml_neighbors: [10, 35]
